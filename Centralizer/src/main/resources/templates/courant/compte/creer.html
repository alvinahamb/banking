<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<h1 th:text="${comptecourant.idCompteCourant} != null ? 'Modifier' : 'Créer'" >Créer un compte</h1>
<form th:action="@{${comptecourant.idCompteCourant} != null ? '/comptecourant/update/' + ${comptecourant.idCompteCourant} : '/comptecourant/create'}" 
      th:object="${comptecourant}" method="post">
    
    <label>Client :</label>
    <select th:field="*{idClient}" required>
        <option th:each="client : ${clients}" 
                th:value="${client.idClient}" 
                th:text="${client.nom} + ' ' + ${client.prenoms}">Client Name</option>
    </select>
    <br/>

    <button type="submit" th:text="${comptecourant.idCompteCourant} != null ? 'Modifier' : 'Créer'">Créer</button></form>

<a href="/">← Retour à la liste</a>
</body>
</html>
