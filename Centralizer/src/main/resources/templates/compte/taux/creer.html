<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<h1 th:text="${taux.idTaux} != null ? 'Modifier' : 'Créer'" >Créer</h1>
<form th:action="@{${taux.idTaux} != null ? '/compte/taux/update/' + ${taux.idTaux} : '/compte/taux/create'}" 
      th:object="${taux}" method="post">
    
    <label for="valeur">Valeur:</label>
    <input type="number" id="valeur" name="libelle" th:field="*{valeur}" required />
    <br/><br/>

    <button type="submit" th:text="${taux.idTaux} != null ? 'Modifier' : 'Créer'">Créer</button></form>

<a href="/">← Retour à la liste</a>
</body>
</html>
