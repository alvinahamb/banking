<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier un Prêt</title>
</head>
<body>
<h1>Créer un nouveau prêt</h1>
<p th:if="${mess}" th:text="${mess}"></p>
<form th:action="@{${pret.idPret} != null ? '/pret/update/' + ${pret.idPret} : '/pret/create'}"
      th:object="${pret}" method="post">

    <label>Client ID :</label>
    <input type="number" th:field="*{idClient}" required /><br/>

    <label>Type de prêt :</label>
    <select th:field="*{typePret.idTypePret}" required>
        <option value="">-- Choisir --</option>
        <option th:each="t : ${typepret}"
            th:value="${t.idTypePret}"
            th:text="${t.libelle}">
    </option>
    </select><br/><br/>

    <label>Montant :</label>
    <input type="number" step="0.01" th:field="*{montant}" required /><br/>

    <label>Taux :</label>
    <input type="number" th:field="*{taux}" required /><br/>

    <label>Durée en mois :</label>
    <input type="number" th:field="*{duree_mois}" required /><br/>

    <button type="submit" th:text="Créer"></button>
</form>

<a href="/pret/all">← Retour à la liste des prêts</a>
</body>
</html>
