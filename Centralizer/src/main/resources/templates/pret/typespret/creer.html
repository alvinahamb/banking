<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Créer un type de prêt</title>
</head>
<body>
<h1>Créer un nouveau type de prêt</h1>
<form th:action="@{${typePret.idTypePret} != null ? '/types-pret/update/' + ${typePret.idTypePret} : '/types-pret/create'}" 
      th:object="${typePret}" method="post">
    
    <label>Libellé :</label>
    <input type="text" th:field="*{libelle}" required /><br/>
    <label>Modalité :</label>
    <select th:field="*{modalite}" required>
        <option value="1">Mensuelle</option>
        <option value="3">Trimestrielle</option>
        <option value="12">Annuelle</option>
    </select>
    <br/>
    <label>Montant minimum :</label>
    <input type="number" step="0.01" th:field="*{montant_min}" required /><br/>

    <label>Montant maximum :</label>
    <input type="number" step="0.01" th:field="*{montant_max}" required /><br/>

    <label>Revenus minimum :</label>
    <input type="number" step="0.01" th:field="*{revenus_min}" required /><br/>

    <label>Taux minimum:</label>
    <input type="number" th:field="*{taux_min}" required /><br/>

    <label>Taux maximum:</label>
    <input type="number" th:field="*{taux_max}" required /><br/>

    <button type="submit" th:text="${typePret.idTypePret} != null ? 'Modifier' : 'Créer'">Créer</button></form>

<a href="/">← Retour à la liste</a>
</body>
</html>
